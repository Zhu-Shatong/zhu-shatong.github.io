short_bio: >-
  <p>
    I am a Master's student in Electrical Engineering at <a href="https://www.stanford.edu/" target="_blank">Stanford University</a>, focusing on software and computer systems, machine learning, and optimization. I am broadly interested in agentic AI, AI infrastructure, and robust learning systems that connect theory with deployable software.
  </p>
  <p>
    My research experience spans cooperative multi-agent reinforcement learning, offline meta-reinforcement learning, and large language model applications. Before Stanford, I earned a B.Eng. in Data Science from <a href="https://www.tongji.edu.cn/" target="_blank">Tongji University</a>, where I worked on mathematical modeling, data mining, and optimization-driven AI systems.
  </p>
  <p>
    I have also built applied AI systems in industry, including RAG-powered search, LLM application workflows, and agentic BI systems for Text-to-SQL and structured analytics.
  </p>

